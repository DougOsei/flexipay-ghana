name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client || npm install --prefix client

      - name: Build client
        env:
          # Served from https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set this repo variable (Settings → Secrets and variables → Actions → Variables)
          # to your deployed backend, e.g. https://flexipay-ghana-api.onrender.com
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm --prefix client run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
